name: Run A/B analysis notebook

on:
  push:
    paths:
      - 'ab_landing_page_analysis.ipynb'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/execute-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert ipykernel
      - name: Run and save results
        run: |
          jupyter nbconvert --to notebook --execute --inplace ab_landing_page_analysis.ipynb --ExecutePreprocessor.timeout=900
      - name: Save executed notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ab_landing_page_analysis.ipynb
          git diff --cached --quiet || (git commit -m "Save A/B analysis outputs" && git push)
